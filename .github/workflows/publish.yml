name: Publish

# Publishes to npm when a GitHub Release is published. GitHub runs the copy of
# this workflow from the default branch, so the released tag cannot alter the
# code that ships it.
#
# Authentication is npm trusted publishing (OIDC): the job proves via a
# short-lived GitHub OIDC token that it is this repository's publish.yml, and
# npm issues a short-lived publish token in exchange. There is no NPM_TOKEN
# secret, and provenance attestations are generated automatically.
#
# The trust relationship is configured on npmjs.com, which only offers the
# setting once the package exists — so the first version is published by hand,
# once. See RELEASING.md.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # the OIDC token npm exchanges for a publish token
    steps:
      - name: Check out the released tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false # never cache release builds

      - name: Check the release tag matches package.json
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$expected" ]; then
            echo "::error::Release $TAG does not match package.json version $expected"
            exit 1
          fi

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Run the test suite
        run: bun test

      - name: Choose the npm dist-tag
        id: dist-tag
        env:
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          if [ "$PRERELEASE" = "true" ]; then
            echo "name=next" >> "$GITHUB_OUTPUT"
          else
            echo "name=latest" >> "$GITHUB_OUTPUT"
          fi

      # A re-run of this workflow, or the one-time hand-published bootstrap
      # release, must not fail on a version the registry already has.
      - name: Check whether this version is already published
        id: exists
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.exists.outputs.published == 'false'
        run: npm publish --tag "${{ steps.dist-tag.outputs.name }}"

      - name: Already on npm
        if: steps.exists.outputs.published == 'true'
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          echo "::notice::$name@$version is already on npm; nothing to publish."
