name: Publish

# One action cuts a release: push the `v*` tag that `npm version` creates, and
# this workflow publishes the tagged version to npm and creates the GitHub
# Release from the version's CHANGELOG.md section. The tagged commit must be on
# `main`, so a tag cut on a branch cannot publish. Creating the Release by hand
# works too — every step skips work that already exists, so the tag and the
# Release can never publish the same version twice.
#
# Authentication is npm trusted publishing (OIDC): the job proves via a
# short-lived GitHub OIDC token that it is this repository's publish.yml, and
# npm issues a short-lived publish token in exchange. There is no NPM_TOKEN
# secret, and provenance attestations are generated automatically.
#
# The trust relationship is configured on npmjs.com, which only offers the
# setting once the package exists — so the first version is published by hand,
# once. See RELEASING.md.

on:
  push:
    tags: ["v*"]
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
      id-token: write # the OIDC token npm exchanges for a publish token
    env:
      TAG: ${{ github.event.release.tag_name || github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out the released tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history: the tag's commit is traced back to main

      # `npm version` tags wherever you happen to be; a tag cut on a branch or
      # a PR head must never publish. Requiring the tagged commit to be
      # reachable from `main` proves review and CI ran on what ships. This
      # only reads history — tags stay entirely a maintainer decision.
      - name: Check the tagged commit is on main
        run: |
          git fetch --no-tags origin main "+refs/tags/$TAG:refs/tags/$TAG"
          commit="$(git rev-parse "$TAG^{commit}")"
          if ! git merge-base --is-ancestor "$commit" origin/main; then
            echo "::error::Tag $TAG points at $commit, which is not on main — land the release on main, then re-tag."
            exit 1
          fi
          echo "$TAG is on main at $commit"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false # never cache release builds

      - name: Check the tag matches package.json
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$expected" ]; then
            echo "::error::Tag $TAG does not match package.json version $expected"
            exit 1
          fi

      # The Release body is the version's CHANGELOG.md section; fail before
      # anything is published when it is missing or empty.
      - name: Check the changelog has this version
        run: node scripts/changelog-section.mjs "$TAG" > "$RUNNER_TEMP/release-notes.md"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      # `prepublishOnly` builds the entry npm consumers run, and the build
      # needs OpenTUI's Solid plugin from the locked development install.
      - name: Install the development dependencies
        run: bun install --frozen-lockfile

      - name: Run the test suite
        run: bun test

      - name: Choose the npm dist-tag and release kind
        id: kind
        run: |
          version="$(node -p "require('./package.json').version")"
          case "$version" in
            *-*)
              echo "dist-tag=next" >> "$GITHUB_OUTPUT"
              echo "prerelease=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "dist-tag=latest" >> "$GITHUB_OUTPUT"
              echo "prerelease=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

      # A re-run, the twin event, or the one-time hand-published bootstrap
      # release must not fail on a version the registry already has.
      - name: Check whether this version is already published
        id: published
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.published.outputs.exists == 'false'
        run: npm publish --tag "${{ steps.kind.outputs.dist-tag }}"

      - name: Already on npm
        if: steps.published.outputs.exists == 'true'
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          echo "::notice::$name@$version is already on npm; nothing to publish."

      - name: Check whether the Release already exists
        id: release
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create the GitHub Release
        if: steps.release.outputs.exists == 'false'
        run: |
          args=("$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md" --verify-tag)
          if [ "${{ steps.kind.outputs.prerelease }}" = "true" ]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}"

      - name: Already released
        if: steps.release.outputs.exists == 'true'
        run: echo "::notice::Release $TAG already exists."
