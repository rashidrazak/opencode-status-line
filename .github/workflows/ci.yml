name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      # The tests import only local modules, so there is nothing to install —
      # `bun test` is the whole suite on a bare checkout.
      - name: Run the test suite
        run: bun test

  package:
    name: package
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      # The build compiles the entry's JSX with OpenTUI's own Solid plugin, so
      # it needs the development install the lockfile pins.
      - name: Install the development dependencies
        run: bun install --frozen-lockfile

      # npm consumers run the built entry, never the TSX: the host hands its
      # Solid runtime to plugin TSX outside node_modules alone (AGENTS.md, *The
      # npm entry is built*). Building is also the syntax check the suite cannot
      # give this file — no test imports src/tui.tsx.
      - name: Build the npm entry
        run: bun run build:entry

      # The tarball is what npm consumers install: every tracked file under
      # src/ must be in it, nothing untracked may slip in, the exports map must
      # point at a packed file, and that file must be the precompiled entry.
      - name: Check the npm tarball
        run: node scripts/check-pack.mjs

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      # The one job that installs: `src/tui.tsx` leans on the host's and
      # Solid's types, which only the committed lockfile pins reproducibly.
      - name: Install the development dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck
