name: Feature request
description: A segment, setting or behaviour the line should grow.
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the situation, not the implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested change
      description: How should the line look or behave?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Before opening
      options:
        - label: I read the customization manual and this is not already configurable.
          required: true
